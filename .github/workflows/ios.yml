name: iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode signing assets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          echo "$IOS_P12_BASE64" | base64 -d > signing.p12
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 -d > profile.mobileprovision

      - name: Install certificate and provisioning profile
        env:
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          security create-keychain -p ci-pass build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-pass build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import signing.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci-pass build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/931d2b40-a18c-4812-934e-22f115a48126.mobileprovision"

      - name: Generate app icon
        run: |
          set -e
          ICONSET="ios/Adis/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          sips -z 1024 1024 ios/Assets/icon-512.png --out "$ICONSET/icon-1024.png"
          cat > "$ICONSET/Contents.json" <<'EOF'
          {"images":[{"size":"1024x1024","idiom":"universal","platform":"ios","filename":"icon-1024.png"}],"info":{"version":1,"author":"xcode"}}
          EOF
          cat > ios/Adis/Assets.xcassets/Contents.json <<'EOF'
          {"info":{"version":1,"author":"xcode"}}
          EOF

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Archive
        run: |
          cd ios
          xcodebuild -project Adis.xcodeproj -scheme Adis -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Adis.xcarchive archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=LWGNB3QJ4H \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="931d2b40-a18c-4812-934e-22f115a48126"

      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive -archivePath build/Adis.xcarchive \
            -exportPath build/export -exportOptionsPlist exportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: Adis.ipa
          path: ios/build/export/Adis.ipa
