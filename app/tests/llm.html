<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Adis live LLM e2e</title></head>
<body>
<p>Live check against the language model configured on the server (costs a fraction of a cent). Run with tools\page-test.ps1.</p>
<pre id="out">running…</pre>
<iframe id="f" src="../index.html#/welcome" style="width:400px;height:800px"></iframe>
<script>
(async () => {
  const out = document.getElementById('out'), lines = []; let fails = 0;
  const log = (ok, msg) => { lines.push((ok ? 'PASS ' : 'FAIL ') + msg); if (!ok) fails++; out.textContent = lines.join('\n'); };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const f = document.getElementById('f');
  try {
    const health = await fetch(location.origin + '/v1/health').then(r => r.json());
    log(health.engine === 'llm', 'server engine: ' + JSON.stringify(health));
    await new Promise(r => f.onload = r);
    f.contentWindow.localStorage.clear();
    f.contentWindow.localStorage.setItem('adis.settings', JSON.stringify({ apiMode: 'server', apiBaseUrl: location.origin + '/v1', onboarded: true }));
    f.contentWindow.location.reload();
    await new Promise(r => f.onload = r); await sleep(1500);
    const A = f.contentWindow.Adis;
    await A.repo.auth.register('Ева', 'llm' + Date.now() + '@example.com', 'password123');
    let deltas = 0, first = 0, done = null; const t0 = Date.now();
    for await (const e of A.repo.chat.stream({ content: 'Сегодня познакомилась с Олегом, он дизайнер в Яндексе', clientMessageId: 'llm-1' })) {
      if (e.type === 'delta') { deltas++; if (!first) first = Date.now() - t0; }
      if (e.type === 'done') done = e.message;
    }
    log(done && done.engine.startsWith('llm:') && deltas > 3, `streamed ${deltas} deltas, first after ${first} ms, engine ${done && done.engine}`);
    const c = done && done.cards.find(x => x.type === 'memory_save');
    log(c && c.data.person && /Олег/.test(c.data.person.name), 'memory card: ' + JSON.stringify(c && c.data.person));
    f.contentWindow.location.hash = '#/chat/new?q=' + encodeURIComponent('Поставь будильник на 6:40 в субботу');
    let card = null;
    for (let i = 0; i < 40 && !card; i++) { await sleep(500); card = f.contentWindow.document.querySelector('.acard.action[data-cid]'); }
    log(card && /06:40/.test(card.innerText), 'chat UI shows alarm card: ' + (card ? card.innerText.replace(/\s+/g, ' ').slice(0, 80) : 'none'));
  } catch (e) { log(false, 'exception: ' + (e && (e.stack || e.message) || e)); }
  lines.push(fails ? `RESULT: ${fails} FAILED` : 'RESULT: ALL PASSED');
  out.textContent = lines.join('\n');
})();
</script>
</body></html>
